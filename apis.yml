name: HNC
description: HNC Software Inc. was a San Diego-based predictive-software company founded in 1986 that
  built neural-network and decision-management systems for credit-card and workers-compensation fraud
  detection, customer analytics, and profitability management across financial services, insurance,
  telecommunications, and retail. Its flagship Falcon product screened a large share of the world's
  payment-card transactions for fraud. HNC was an early Battery Ventures investment, went public in 1995,
  and was acquired by Fair Isaac (FICO) in May 2002; it no longer operates as an independent entity and
  publishes no current developer or API surface.
